<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Access Requests Dashboard</title>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Inter', sans-serif;
    }

    .fade-in {
        animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .slide-up {
        animation: slideUp 0.4s ease forwards;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px); }
        to   { opacity: 1; transform: translateY(0); }
    }
</style>

</head>

<body class="bg-gray-100 text-gray-800">

<!-- NAVBAR -->
<div class="w-full bg-white shadow-md p-4 flex justify-between items-center fixed top-0 z-50">
    <h1 class="text-2xl font-bold tracking-wide text-gray-800">Access Request Dashboard</h1>
</div>

<!-- CONTENT WRAPPER -->
<div class="pt-24 px-8 fade-in">

    <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-200">

        <h2 class="text-xl font-semibold mb-4">Pending Requests</h2>

        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-gray-300 text-gray-600">
                    <th class="p-3">BRID ID</th>
                    <th class="p-3">Full Name</th>
                    <th class="p-3">Email</th>
                    <th class="p-3">Requested Access</th>
                    <th class="p-3">Manager Status</th>
                    <th class="p-3">Actions</th>
                </tr>
            </thead>

            <tbody id="requestTable">
            </tbody>
        </table>
    </div>
</div>

<!-- PASSWORD MODAL -->
<div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center z-50">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-96 slide-up">
        <h3 class="text-xl font-bold mb-4 text-gray-800">Generated Password</h3>
        <div id="generatedPassword" class="text-2xl font-mono bg-gray-200 p-3 rounded-lg mb-4 tracking-wider"></div>

        <button onclick="closeModal()"
            class="w-full py-2 bg-blue-600 rounded-lg text-white hover:bg-blue-700 transition">
            Close
        </button>
    </div>
</div>

<script src="admin_script.js"></script>

</body>
</html>
